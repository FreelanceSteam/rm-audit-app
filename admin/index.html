
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0754c8">
  <meta name="description" content="RM Audit Admin App">
  <title>RM Audit Admin</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./rm-audit-admin-192.png">
  <link rel="apple-touch-icon" href="./rm-audit-admin-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(145deg, #0754c8, #06245d);
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .logo {
      display: block;
      width: 160px;
      height: 160px;
      object-fit: contain;
      margin: 0 auto 22px;
    }

    .subtitle {
      font-size: 16px;
      margin: 0 0 28px;
    }

    button {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #ffca18;
      color: #061b43;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.2);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    #installApp {
      margin-top: 14px;
      background: white;
    }

    .note {
      font-size: 12px;
      line-height: 1.6;
      margin: 22px 0 0;
    }

    .credit {
      margin: 14px 0 0;
      font-size: 12px;
      font-weight: bold;
      color: #ffca18;
    }

    /* Larger launcher for desktop and installed desktop app */
    @media (min-width: 768px) {
      body {
        padding: 40px;
      }

      main {
        width: min(760px, 90vw);
        max-width: 760px;
        padding: 56px 48px;
        border-radius: 32px;
      }

      .logo {
        width: 220px;
        height: 220px;
        margin-bottom: 26px;
      }

      .subtitle {
        font-size: 22px;
        margin-bottom: 34px;
      }

      button {
        min-height: 64px;
        font-size: 19px;
        border-radius: 14px;
      }

      .note {
        font-size: 14px;
        margin-top: 24px;
      }

      .credit {
        font-size: 14px;
        margin-top: 16px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 14px;
      }

      main {
        padding: 24px 18px;
      }

      .logo {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="./rm-audit-admin-192.png"
      alt="RM Audit Admin"
    >

    <p class="subtitle">Admin Management App</p>

    <button id="openApp">OPEN ADMIN APP</button>
    <button id="installApp" hidden>INSTALL APP</button>

    <p class="note">
      Secure access is handled by the official Admin app.
    </p>

    <p class="credit">Designed by Nagendra Yadav</p>
  </main>

  <script>
    // Existing official Admin Web App URL
    const APP_URL = "https://script.google.com/macros/s/AKfycbyjSKykm4rTutnb9EOUyHf0HFAWM8uhcf7jR8EM3R2Oo3O6wc_v4eg6jdY9EeIHkaO5/exec?page=admin";

    const openButton = document.getElementById("openApp");
    const installButton = document.getElementById("installApp");

    let deferredInstallPrompt = null;

    openButton.addEventListener("click", function () {
      const appUrl = APP_URL.trim();

      if (!appUrl.startsWith("https://script.google.com/")) {
        alert("Please configure the existing Admin Web App URL first.");
        return;
      }

      openButton.disabled = true;
      openButton.textContent = "OPENING ADMIN APP...";

      window.location.assign(appUrl);
    });

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener("click", async function () {
      if (!deferredInstallPrompt) {
        alert("Chrome menu se Install app ya Add to Home screen select karein.");
        return;
      }

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;

      deferredInstallPrompt = null;
      installButton.hidden = true;
    });

    window.addEventListener("appinstalled", function () {
      installButton.hidden = true;
      deferredInstallPrompt = null;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function (error) {
            console.error(
              "Service worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
```
