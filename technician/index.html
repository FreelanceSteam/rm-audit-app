<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0754c8">
  <meta name="description" content="RM Audit Technician App">
  <title>RM Audit Technician</title>

<script>
  (function () {
    const launchURL = new URL(window.location.href);
    launchURL.hash = "";

    const manifest = {
      id: launchURL.href,
      name: "RM Audit Technician",
      short_name: "RM Audit",
      start_url: launchURL.href,
      scope: new URL("./", launchURL).href,
      display: "standalone",
      orientation: "portrait",
      background_color: "#06245d",
      theme_color: "#0754c8",
      icons: [
        {
          src: "./rm-audit-technician-192.png",
          sizes: "192x192",
          type: "image/png",
          purpose: "any"
        },
        {
          src: "./rm-audit-technician-512.png",
          sizes: "512x512",
          type: "image/png",
          purpose: "any"
        }
      ]
    };

    const blob = new Blob(
      [JSON.stringify(manifest)],
      { type: "application/manifest+json" }
    );

    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = URL.createObjectURL(blob);
    document.head.appendChild(manifestLink);
  })();
</script>
  <link rel="icon" type="image/png" href="./rm-audit-technician-192.png">
  <link rel="apple-touch-icon" href="./rm-audit-technician-192.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px; font-family: Arial, sans-serif;
      color: white; background: linear-gradient(145deg, #0754c8, #031638);
    }
    main {
      width: 100%; max-width: 380px; padding: 30px 22px; text-align: center;
      border-radius: 24px; background: rgba(255,255,255,.12);
      box-shadow: 0 18px 45px rgba(0,0,0,.3);
    }
    .logo {
      width: 150px; height: 150px; object-fit: contain; border-radius: 24px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.25));
    }
    h1 { margin: 18px 0 8px; }
    p { color: #e0eaff; }
    button {
      width: 100%; margin-top: 22px; padding: 16px; border: 0;
      border-radius: 12px; background: #ffd21c; color: #061b42;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #installApp {
      width: auto; margin-top: 10px; padding: 9px 18px;
      border: 1px solid white; border-radius: 8px; background: white;
      color: #0754c8; font-size: 12px;
    }
    #installApp[hidden] { display: none; }
    .note { font-size: 12px; margin-top: 18px; }
    .credit {
      margin-top: 14px; font-size: 12px; font-weight: 600;
      letter-spacing: 1px; color: #ffd84d;
    }
    @media (max-width: 480px) {
      .logo { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./rm-audit-technician-192.png" alt="RM Audit Technician">
    <h1>RM Audit</h1>
    <p>Technician Audit App</p>
    <button id="openApp">OPEN RM AUDIT</button>
    <button id="installApp" hidden>INSTALL APP</button>
    <p class="note">Secure technician access is handled by the official audit app.</p>
    <p class="credit">Designed by Nagendra Yadav</p>
  </main>

  <script>
    "use strict";

    const APP_URL = "https://script.google.com/macros/s/AKfycbyjSKykm4rTutnb9EOUyHf0HFAWM8uhcf7jR8EM3R2Oo3O6wc_v4eg6jdY9EeIHkaO5/exec";
    const TOKEN_KEY = "rm_technician_token";
    const openButton = document.getElementById("openApp");
    const installButton = document.getElementById("installApp");
    let deferredInstallPrompt = null;

    // Keep the personal token in the launch URL as well as local storage.
    // iOS Home Screen web apps can use a separate storage context from Safari.
    const params = new URLSearchParams(window.location.search);
    const incomingToken = (params.get("token") || "").trim();

    if (incomingToken) {
      try {
        localStorage.setItem(TOKEN_KEY, incomingToken);
      } catch (error) {
        console.warn("Token storage unavailable; launch URL token remains available.", error);
      }
    }

    function getTechnicianToken() {
      // URL token is authoritative, then use the saved token as fallback.
      if (incomingToken) return incomingToken;
      try {
        return (localStorage.getItem(TOKEN_KEY) || "").trim();
      } catch (error) {
        console.error("Could not read technician token:", error);
        return "";
      }
    }

    openButton.addEventListener("click", function () {
      const token = getTechnicianToken();
      if (!token) {
      let savedToken = "MISSING";

try {
  savedToken = localStorage.getItem(TOKEN_KEY) ? "FOUND" : "MISSING";
} catch (error) {
  savedToken = "BLOCKED";
}

alert(
  "TOKEN DEBUG\n\n" +
  "Current URL: " + window.location.href + "\n\n" +
  "URL Token: " + (incomingToken ? "FOUND" : "MISSING") + "\n\n" +
  "Saved Token: " + savedToken
);
        return;
      }

      const target = new URL(APP_URL);
      target.searchParams.set("token", token);
      openButton.disabled = true;
      openButton.textContent = "OPENING RM AUDIT...";
      window.location.assign(target.toString());
    });

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener("click", async function () {
      if (!deferredInstallPrompt) {
        alert("Chrome menu se Install app ya Add to Home screen select karein.");
        return;
      }
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });

    window.addEventListener("appinstalled", function () {
      installButton.hidden = true;
      deferredInstallPrompt = null;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function (error) {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
