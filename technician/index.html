
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0754c8">
  <title>RM Audit Technician</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./rm-audit-technician-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #0754c8, #031638);
    }

    main {
      width: 100%;
      max-width: 380px;
      padding: 30px 22px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255,255,255,.12);
      box-shadow: 0 18px 45px rgba(0,0,0,.3);
    }

    img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 20px;
    }

    h1 { margin: 18px 0 8px; }

    p { color: #e0eaff; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #ffd21c;
      color: #061b42;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .note { font-size: 12px; margin-top: 18px; }
  </style>
</head>

<body>
  <main>
    <img src="./rm-audit-technician-192.png" alt="RM Audit Technician">
    <h1>RM Audit</h1>
    <p>Technician Audit App</p>

    <button id="openApp">OPEN RM AUDIT</button>

    <p class="note">
      Secure technician access is handled by the official audit app.
    </p>
  </main>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyjSKykm4rTutnb9EOUyHf0HFAWM8uhcf7jR8EM3R2Oo3O6wc_v4eg6jdY9EeIHkaO5/exec";

    document.getElementById("openApp").addEventListener("click", () => {
      window.location.href = APP_URL;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.log("Offline setup unavailable:", error));
      });
    }
  </script>
</body>
</html>
