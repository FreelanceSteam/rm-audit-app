<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0754c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RM Audit">

  <title>RM Audit</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png"
        href="./rm-audit-technician-192.png">
  <link rel="apple-touch-icon"
        href="./rm-audit-technician-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #06245d, #0754c8);
      color: #fff;
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 30px 22px;
      border-radius: 26px;
      background: rgba(255,255,255,.12);
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 24px;
    }

    h1 { margin: 16px 0 8px; }

    p {
      line-height: 1.5;
      color: #e6efff;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    input { background: #fff; color: #111; }

    button {
      background: #ffd21f;
      color: #06245d;
      font-weight: bold;
      cursor: pointer;
    }

    .note { font-size: 12px; margin-top: 18px; }
  </style>
</head>

<body>
  <main class="app">
    <img class="logo"
         src="./rm-audit-technician-512.png"
         alt="RM Audit logo">

    <h1>RM Audit</h1>
    <p>Technician Audit App</p>

    <input
      id="token"
      type="password"
      autocomplete="off"
      placeholder="Enter your technician token"
      aria-label="Technician token">

    <button id="openApp">OPEN RM AUDIT</button>

    <p class="note">
      Your token is not saved by this launcher.
    </p>
  </main>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyjSKykm4rTutnb9EOUyHf0HFAWM8uhcf7jR8EM3R2Oo3O6wc_v4eg6jdY9EeIHkaO5/exec";

    document.getElementById("openApp").addEventListener("click", () => {
      const token = document.getElementById("token").value.trim();

      if (!token) {
        alert("Please enter your technician token.");
        return;
      }

      const url = new URL(APP_URL);
      url.searchParams.set("token", token);
      window.location.href = url.toString();
    });
  </script>
</body>
</html>
